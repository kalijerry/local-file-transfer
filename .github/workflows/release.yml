# 发版：只有推送 vX.Y.Z 格式的标签（如 v0.1.0、v1.2.3）才会发版。
#   git tag v0.1.0 && git push origin v0.1.0
# 标签必须打在 main 上已有的提交上。
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::标签 $GITHUB_REF_NAME 不是 vX.Y.Z 格式，不发版"
            exit 1
          fi
          echo "APP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::标签 $GITHUB_REF_NAME 指向的提交不在 main 上，请先合并到 main 再打标签"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 可选：在仓库 Secrets 中配置 RELEASE_KEYSTORE_BASE64 等，即可用正式密钥签名
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "使用正式发布密钥签名"
          else
            echo "未配置发布密钥，使用仓库内的调试密钥签名"
          fi

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/TransferHub-${GITHUB_REF_NAME}.apk"
          # 固定文件名，供下载页使用 releases/latest/download/TransferHub.apk 这个永久链接
          cp app/build/outputs/apk/release/app-release.apk dist/TransferHub.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 传送站 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/TransferHub-${{ github.ref_name }}.apk
            dist/TransferHub.apk
            dist/SHA256SUMS.txt
