# 发版。两种方式，效果相同：
#
# 1. 在 GitHub 网页上一键发版（推荐）：
#    Actions → Release → Run workflow（分支选 main）
#    - 不填版本号：按「递增方式」在最新的 vX.Y.Z 基础上自动 +1
#    - 填写版本号：使用指定的 X.Y.Z（必须大于现有的最新版本）
#    工作流会在 main 的最新提交上创建 vX.Y.Z 标签并发布 Release。
#
# 2. 命令行推送标签：
#    git tag v0.1.0 && git push origin v0.1.0
#    标签必须是严格的 vX.Y.Z 格式，并且打在 main 上已有的提交上。
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      bump:
        description: "递增方式（未填写版本号时使用）：patch 0.1.0→0.1.1，minor 0.1.0→0.2.0，major 0.1.0→1.0.0"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "指定版本号 X.Y.Z（可选，例如 1.0.0；填写后忽略递增方式）"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          latest=$(git tag -l 'v*' | grep -E "$semver" | sort -V | tail -n1 || true)

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::只能从 main 分支发版，请在 Run workflow 时选择 main"
              exit 1
            fi
            version="$(printf '%s' "$VERSION_INPUT" | tr -d '[:space:]')"
            version="${version#v}"
            if [ -z "$version" ]; then
              IFS=. read -r major minor patch <<< "${latest#v}"
              major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
              case "$BUMP" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                *)     patch=$((patch + 1)) ;;
              esac
              version="$major.$minor.$patch"
            fi
            tag="v$version"
            if [[ ! "$tag" =~ $semver ]]; then
              echo "::error::版本号 $version 不是 X.Y.Z 格式"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::标签 $tag 已存在，请换一个版本号"
              exit 1
            fi
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -n1)" != "$tag" ]; then
              echo "::error::新版本 $tag 必须大于当前最新版本 $latest，否则手机上无法覆盖升级"
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ $semver ]]; then
              echo "::error::标签 $tag 不是 vX.Y.Z 格式，不发版"
              exit 1
            fi
            git fetch origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::标签 $tag 指向的提交不在 main 上，请先合并到 main 再打标签"
              exit 1
            fi
          fi

          echo "发版版本：$tag（上一个版本：${latest:-无}）"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${tag#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 可选：在仓库 Secrets 中配置 RELEASE_KEYSTORE_BASE64 等，即可用正式密钥签名
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "使用正式发布密钥签名"
          else
            echo "未配置发布密钥，使用仓库内的调试密钥签名"
          fi

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/TransferHub-${TAG}.apk"
          # 固定文件名，供下载页使用 releases/latest/download/TransferHub.apk 这个永久链接
          cp app/build/outputs/apk/release/app-release.apk dist/TransferHub.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # 手动发版时，标签由这一步在当前 main 提交上创建
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: 传送站 ${{ env.TAG }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/TransferHub-${{ env.TAG }}.apk
            dist/TransferHub.apk
            dist/SHA256SUMS.txt

      - name: Summary
        run: |
          {
            echo "## 已发布 传送站 $TAG"
            echo ""
            echo "- Release：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo "- 最新版永久下载链接：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/TransferHub.apk"
          } >> "$GITHUB_STEP_SUMMARY"
